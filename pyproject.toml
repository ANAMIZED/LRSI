[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrsi"
version = "0.1.0"
description = "LRSI — Local Recursive Self-Improvement as an Autonomous Agentic Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LRSI Contributors"}]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
live = ["openai>=1.0.0"]
mcp = ["mcp>=1.0.0"]
api = ["fastapi", "uvicorn"]

[project.scripts]
lrsi = "lrsi.cli:app"
lrsi-mcp = "lrsi.mcp.server:main"
lrsi-api = "lrsi.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
